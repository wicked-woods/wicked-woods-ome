name: Validate and Upload

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: swift:6.3

    env:
      AWS_REGION: us-west-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout legacy OME parser
        uses: actions/checkout@v4
        with:
          repository: ometools/open-music-event
          ref: 40c7d2abe42eba8649cf61943ab5a1702e027f4b
          path: .legacy-open-music-event

      - name: Run legacy validation tool
        run: |
          cp .github/legacy-parser/Package.resolved .legacy-open-music-event/Core/Package.resolved
          echo "Running validation tool..."
          swift run \
            --package-path .legacy-open-music-event/Core \
            open-music-event validate .

  upload_contents_to_s3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-west-2
      S3_BUCKET: wicked-woods-distribution-bucket
      DISTRIBUTION_ID: E3LMXX06QSLNNW

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create zip of repository
        run: |
          zip -r ${{ github.event.repository.name }}.zip . -x "*.png" "*.jpg" "*.jpeg" "*.gif" "*.bmp" "*.tiff" "*.webp" "*.ico" "*.svg"

      - name: Upload zip to S3
        run: |
          aws s3 cp ${{ github.event.repository.name }}.zip s3://${S3_BUCKET}/${{ github.event.repository.name }}.zip

      - name: Sync repository to S3
        run: |
          aws s3 sync . s3://${S3_BUCKET}/wicked-woods-ome/ --delete --exclude "${{ github.event.repository.name }}.zip"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

  send_notifications:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.NOTIFICATIONS_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.NOTIFICATIONS_AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install boto3
      run: pip install boto3 firebase-admin

    - name: Run Python script
      run: python .github/scripts/push-notifications.py

  send_update_notification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: upload_contents_to_s3
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.NOTIFICATIONS_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.NOTIFICATIONS_AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install boto3
      run: pip install boto3 firebase-admin

    - name: Run Python script
      run: python .github/scripts/notify-update.py
