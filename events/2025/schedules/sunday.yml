  relaxation-ridge:
  - title: Hypnotic Meditation
    description: 'A meditative psychedelic journey, experience a safe way to experience
      the hypnagogic state easily without plant medicines.


      Awaken infinite potentials, heal and release stuck beliefs, emotions and physical
      symptoms, Find peace, deep relaxation, and connection.

      '
    startTime: '10:00'
    endTime: '11:00'
    contributors:
    - id: Lucia Light
  - title: Healing Strings and Sacred Sounds
    description: "Join husband-and-wife duo Quinton and Kendra Armstrong for a deeply
      transformative and immersive live sound healing experience designed to bring
      participants into a state of deep relaxation, rejuvenation, and self-discovery.\n\nIn
      this workshop, Kendra will guide participants through breathwork while playing
      quartz crystal and Tibetan singing bowls. Quinton will complement the experience
      with soothing, psychedelic electric guitar riffs, adding a layer of musical
      healing through the use of various guitar pedals.\n\nThe soothing tones of the
      crystal and Tibetan singing bowls, each tuned to a specific chakra, will help
      align participants' physical and energetic bodies. This sound journey will guide
      them into a deep meditative state, facilitating the release of what no longer
      serves them. As the healing vibrations resonate throughout the body, participants
      will experience a profound recalibration at a cellular level, resetting the
      nervous system, calming the mind, and offering a sense of true rest.\n\nParticipants
      will be invited to lie down in a peaceful, comfortable environment, allowing
      them to fully receive the benefits of the sound bath. The workshop will leave
      them feeling balanced, relaxed, and reconnected to their highest self.Please
      bring a yoga mat or blanket to lay down on and any other props you\u2019d like
      to feel cozy (blanket, pillow, crystals).\n"
    startTime: '11:15'
    endTime: '12:30'
    contributors:
    - id: Mindful Moon Sound
  - title: "Intro Into \u0100yurveda"
    description: 'Join this workshop to start your journey into the ancient wisdom
      Ayurveda. Known as the mother of medicine, Ayurveda is the oldest system of
      healing known to human kind. Despite having over 5000 years of history, Ayurveda
      is timeless because it understands and applies natural law to assist us in bringing
      harmony to our lives.


      This workshop will give you a base understanding of what Ayurveda is, its origins
      and provide insights to the lens of Ayurvedic medicine. This workshop is ideal
      for anyone interested in natural health, yoga practitioners, wellness professionals,
      or those seeking a deeper connection to their body and the rhythms of nature.


      Leave with a foundational understanding of Ayurveda as well as resources to
      begin incorporating Ayurveda into your life.

      '
    startTime: '12:45'
    endTime: '13:45'
    contributors:
    - id: Sara DeVita
  - title: All Levels Acroyoga Workshop
    description: "Whether you're new to AcroYoga or looking to refine your skills,
      come experience the magic of movement, laughter, and shared balance.\n\nStoked
      Acroyoga has brought their energy to festivals like Kaslo Jazz Fest, Calgary
      AcroYoga Festival, and Kootenay Yoga Festival\u2014and now it\u2019s your turn
      to fly!\n"
    startTime: '14:00'
    endTime: '15:00'
    contributors:
    - id: Stoked Acroyoga
  - title: Harm Reduction 101 - Party Safer
    description: "This workshop covers the core safety skills every raver should know
      - from sticking with your crew and spotting drinks spiking, to knowing when
      it\u2019s time to take a break. We\u2019ll go over how to recognize when someone
      needs support, went to take a break, and then the importance of the body system.\n\nActivities
      include: buddy tag making and quick fire festival trivia, all while doing drinks,
      spiking games to raise awareness.\n"
    startTime: '15:15'
    endTime: '16:15'
    contributors:
    - name: ANKORS
  - title: 'Dance: A Love Letter For Nature'
    startTime: '16:30'
    endTime: '18:00'
    contributors:
    - id: Alison Lenora Lambert
  - title: Wicked Woods 2nd Annual Poetry Slam
    description: 'The Wicked Woods Poetry Slam is a one-of-a-kind, open-air spoken
      word event that merges poetry, storytelling, and performance art into an immersive
      festival experience. Hosted in a vibrant outdoor setting, this event invites
      festival-goers to witness and participate in a dynamic celebration of words,
      rhythm, and raw emotion.


      As the host, I will begin by setting the tone with a curated selection of spoken
      word performances, creating an inviting and inspiring atmosphere. As the energy
      builds, audience members will be encouraged to step up and share their own poetry,
      transforming the event into a spontaneous and interactive exchange of voices,
      perspectives, and emotions. Whether you''re a seasoned poet or simply someone
      who loves the beauty of language, this is a space for you to engage, express,
      and connect.

      '
    startTime: '18:15'
    endTime: '19:15'
    contributors:
    - id: Daniel Zuccarello
