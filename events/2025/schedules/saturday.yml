  relaxation-ridge:
  - title: Connecting With Authenticity
    description: A fun and enlivening Kundalini infused yoga class to help you to
      connect to your center, followed by some group excersises to get you connecting
      authentically on the dance floor!
    startTime: '10:00'
    endTime: '11:00'
    contributors:
    - id: Crystal McLean
  - title: Ecstatic Dance with APUKUNA
    description: "Ecstatic Dance is a freeform, non-verbal movement practice where
      you\u2019re invited to move however you feel \u2014 with freedom, spontaneity,
      and self-expression. Imagine a DJ and a dance floor, but without talking, without
      phones, and where the music carries you on an epic journey from beginning to
      end.\n\nAPUKUNA will open the space with an introduction to Ecstatic Dance and
      gently guide you into your own self-directed exploration of movement, emotional
      release, stillness, and joy.\n"
    startTime: '11:30'
    endTime: '13:00'
    contributors:
    - name: Jon Steinman
  - title: 'New Groove Revolution: Release, Reframe, and Reintegrate'
    description: "Do you love crafting positive statements or setting goals, but sometimes
      feel they don\u2019t truly stick? Maybe they sound forced, fake, or part of
      you still doubts them?\n\nThis unique playshop blends the creative magic of
      the \u201CLore\u201D of Attraction with the depth of Humanistic NLP and story
      work - so your words become a living narrative your subconscious can embrace.
      A new story that is actually truth-full.\n\nTogether, we\u2019ll explore:\n
      \ - How to spot and gently release limiting thought patterns through contrast\n
      \ \u2013 A step-by-step method to craft statements that feel truthful, personal,
      and present\n  \u2013 Why your words and emotions shape your reality and how
      to consciously shift your frequency\n  \u2013 How to use story work to weave
      your personalized statements into an Ideal Life Story: a short, powerful paragraph
      that feels real, inspiring, and aligned with your deepest values\n\nWhat you\u2019ll
      experience:\n  \u2013 Use a uniquely designed Life Wheel to identify what areas
      of life matter most to you now\n  \u2013 Tap into your subconscious to uncover
      the deeper essence behind your wants and desires\n  \u2013 Combine HNLP principles,
      the Lore of Attraction, and story work to craft personalized statements\n  \u2013
      Weave these into your Ideal Life Story your new daily narrative\n  \u2013 Discuss
      creative ways to anchor, integrate and embody your story\n  \u2013 Optionally
      share your story with the group to \u201Cbreathe it into being\u201D\n  \u2013
      Close with a gentle Integration Meditation Journey to ground your new story
      into your mind, body and soul (you can keep your eyes open if that feels more
      comfortable for you)\n\n  Create New Grooves for your life! Ones that feels
      honest, alive, and truly yours.\n\n  Notes: We\u2019ll begin with a short, trauma-informed
      grounding practice to create a safe, supportive space. We prioritize your comfort
      and consent during all activities.\n\n  Supplies (Optional) Paper and pens will
      be provided; however feel free to bring your journal and coloring pens if you
      wish plus anything that helps you to feel comfortable such as yoga mat / pillow,
      blanket, fidgets toys (nothing noisy please).\n"
    startTime: '13:15'
    endTime: '14:45'
    contributors:
    - id: DJ sprouT
  - title: Festival Integration Circle
    description: "Reflect. Ground. Integrate.\n\nThe dance floor isn\u2019t the only
      place where transformation happens. Join Jenn Moonflower, for a drop-in Integration
      Circle. A grounding and welcoming space to help you process, reflect, and make
      meaning of your festival journey.\n\nWhether your experiences this weekend have
      been expansive, emotional, psychedelic, or simply overwhelming in the best of
      ways, this workshop offers a chill zone to come back to yourself. Through gentle
      breathwork, mindful reflection, and real conversation, you\u2019ll receive tools
      to anchor insights and bring clarity to the magic you\u2019ve been moving through.\n\n\u2728
      What to expect:\n  - A safe, inclusive space for open sharing and deep listening\n
      \ - Breathwork + meditation to regulate and restore\n  - Practical tools for
      integrating festival moments, plant medicine, or microdosing journeys\n  - No-pressure
      discussion and support in community\n  - Optional sharing - come to witness,
      or come to be witnessed\n  - Tips for carrying the transformation home with
      you\n\nThis circle is open to all genders, identities, and experience levels.
      Come as you are, whether you're vibing high or feeling a little frayed, and
      leave feeling more grounded, connected, and aligned with tools to integrate
      the magic of your festival experience.\n"
    startTime: '15:00'
    endTime: '16:00'
    contributors:
    - id: Jenn Moonflower
  - title: 'Pleasure + Protection: Safer Sex in The Wild'
    description: "Safer Sex in the Wild: Explore the art of having safer sex at festivals
      \u2014 from consent to condoms to STI testing.\n\nWe\u2019ll cover practical
      tips and education for STI/STBBI prevention. Activities include barrier method
      demos, sex trivia, and creating take-home mini kits and stuff the condom games.\n"
    startTime: '16:30'
    endTime: '17:30'
    contributors:
    - name: ANKORS
  - title: The Body Is The Bassline
    description: "Get grounded before you get down.\n\nThis pre-rave warm-up is a
      guided movement and breath journey designed to prime your body and nervous system
      for the dancefloor. We\u2019ll stretch open the hips, hamstrings, spine, and
      shoulders, shake off tension, activate energy channels, and land deeply in the
      body\u2014so you can dance from a place of freedom, flow, and full-body yes.\n\nWe'll
      blend functional mobility, somatic unwinding, gentle self-massage, breath regulation,
      and grounding techniques to help participants:\n  Release tightness from travel,
      camping, or previous nights dancing\n  Reconnect to their body and breath before
      stimulation\n  Regulate the nervous system (especially for those with social
      or sensory sensitivity)\n  Increase mobility and stamina for dancingCultivate
      presence, joy, and body awareness\n\nAll bodies and experience levels are welcome.
      No previous movement or yoga experience is needed. Just bring a mat or towel,
      water, and a curiosity for what it means to move with your body, not against
      it.\n\nThis is the ultimate act of self-care before you set your soul loose
      on the dancefloor.\n\nCome get loose, get embodied, and get ready to rave with
      heart.\n"
    startTime: '17:45'
    endTime: '18:45'
    contributors:
    - id: Peta Thompson
  - title: Air Bending 101
    description: "Learn to wield your folding fan like an airbending master with the
      FloWarrior. Folding fans are beautiful, badass, easy to learn, and loads of
      fun! In this workshop we\u2019ll learn how to open, close, cut, spin, and throw
      your fan like the ninja/geisha/other of your choosing. All levels welcome\u2014whether
      it\u2019s your first fan or your hundredth, you\u2019ll leave inspired and full
      of new moves to play with. Fans are provided, fun is guaranteed.Come play!"
    startTime: '19:00'
    endTime: '20:00'
    contributors:
    - name: Daniel Tamagi
