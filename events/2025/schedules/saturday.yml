  aurora-gallery:
  - title: Weaving Wellness
    description: "This workshop consists of art therapy exercises focused on personal
      meaning-making and community building.\n\nThe goal is to create a large-scale
      yarn and mixed-textile weaving that serves as a collaborative, evolving installation.
      Even after the workshop concludes, festival-goers who may have missed it can
      still engage with the piece\u2014adding their own contributions and interacting
      with the work throughout the festival  - offering relational based and connectivity.\n"
    startTime: '12:00'
    endTime: '13:30'
    contributors:
    - id: Samantha Strachan
  - title: The Joy Of Poi
    description: "Unleash your playful side and explore the Joy of Poi!\n\nWhether
      you\u2019re looking for a fun way to exersize or a fresh creative outlet, this
      workshop will help you find your flow and light your smile. In this dynamic
      workshop, you\u2019ll quickly learn the basics that will have you spinning,
      laughing, and embracing the Joy of Poi.\n\nWe will explore beginner techniques
      like weaves, butterflies, turns, and stalls. Already know the basics? Robin
      will guide you to the next level, offering more advanced techniques tailored
      to your skill level.\n\nWhether you\u2019re here for fun, creative movement,
      or mastering a new skill, The Joy of Poi offers a joyful and transformative
      journey into the art of poi spinning.\n"
    startTime: '15:00'
    endTime: '16:00'
    contributors:
    - name: Robin Mote
